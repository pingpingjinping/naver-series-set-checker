name: WalnutPi Aladin eBook Comic Calendar Watch

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aladin-state-writes
  cancel-in-progress: false

jobs:
  aladin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Aladin ebook comic calendar
        env:
          DISCORD_WEBHOOK: ${{ secrets.SERIES_DISCORD_WEBHOOK }}
        run: python aladin_calendar_watch.py

      - name: Save state
        run: |
          if git diff --quiet -- aladin_calendar_state.json; then
            echo "aladin_calendar_state.json 변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aladin_calendar_state.json
          git commit -m "chore: update Aladin calendar state"

          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push 충돌, 재시도 ${attempt}/4"
            sleep $((attempt * 2))
          done

          echo "Aladin state push 실패" >&2
          exit 1
