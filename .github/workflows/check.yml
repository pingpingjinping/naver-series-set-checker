name: Naver Series Set Watch

on:
  schedule:
    # 한국시간 매일 오전 6시 = UTC 21:00 (전날)
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      send_test:
        description: "Discord 테스트 알림 보내기"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: naver-series-set-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send test notification
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -fsS \
            -H 'Content-Type: application/json' \
            -d '{"content":"✅ 네이버 시리즈 세트 체크 알림 테스트 성공! GitHub Actions → Discord 연결이 정상입니다."}' \
            "$DISCORD_WEBHOOK"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Naver Series
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python check.py

      - name: Save state
        run: |
          if git diff --quiet -- state.json; then
            echo "state.json 변경 없음"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "chore: update Naver Series watch state"
          git push
