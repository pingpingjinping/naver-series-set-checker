name: Naver Series & Price Watch

on:
  schedule:
    # 한국시간 매일 오전 6시 = UTC 21:00 (전날)
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      send_test:
        description: "Discord 테스트 알림 보내기"
        required: false
        default: false
        type: boolean
      send_current_prices:
        description: "현재 가격 목록 보내기 (번호 포함)"
        required: false
        default: false
        type: boolean
      add_urls:
        description: "추가할 URL들 (여러 개는 줄바꿈/공백/쉼표로 구분)"
        required: false
        default: ""
        type: string
      remove_numbers:
        description: "삭제할 번호들 (예: 1,3,5)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: naver-series-set-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send test notification
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -fsS \
            -H 'Content-Type: application/json' \
            -d '{"content":"✅ 네이버 시리즈 / 가격 체크 알림 테스트 성공! GitHub Actions → Discord 연결이 정상입니다."}' \
            "$DISCORD_WEBHOOK"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Manage price URLs
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.add_urls != '' || inputs.remove_numbers != '') }}
        env:
          ADD_URLS: ${{ inputs.add_urls }}
          REMOVE_NUMBERS: ${{ inputs.remove_numbers }}
        run: python manage_price_urls.py

      - name: Check Naver Series
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python check.py

      - name: Check prices
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SEND_CURRENT_REPORT: ${{ github.event_name == 'workflow_dispatch' && inputs.send_current_prices }}
        run: python price_watch.py

      - name: Save state and URL list
        run: |
          if git diff --quiet -- state.json price_state.json price_urls.txt; then
            echo "상태/URL 파일 변경 없음"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json price_state.json price_urls.txt
          git commit -m "chore: update watch state and price URLs"
          git push
