name: Manual Watch & Price Manager

on:
  workflow_dispatch:
    inputs:
      send_test:
        description: "Discord 테스트 알림 보내기"
        required: false
        default: false
        type: boolean
      send_current_prices:
        description: "현재 가격 목록 보내기 (삭제 번호 포함)"
        required: false
        default: false
        type: boolean
      add_urls:
        description: "추가할 URL들 (여러 개는 줄바꿈/공백/쉼표로 구분)"
        required: false
        default: ""
        type: string
      remove_numbers:
        description: "삭제할 번호들 (예: 1,3,5)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: watch-state-writes
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send test notifications
        if: ${{ inputs.send_test }}
        env:
          SERIES_DISCORD_WEBHOOK: ${{ secrets.SERIES_DISCORD_WEBHOOK }}
          PRICE_DISCORD_WEBHOOK: ${{ secrets.PRICE_DISCORD_WEBHOOK }}
        run: |
          curl -fsS \
            -H 'Content-Type: application/json' \
            -d '{"content":"✅ 네이버 시리즈 알림 테스트 성공!"}' \
            "$SERIES_DISCORD_WEBHOOK"
          sleep 5
          curl -fsS \
            -H 'Content-Type: application/json' \
            -d '{"content":"✅ 가격 추적 알림 테스트 성공!"}' \
            "$PRICE_DISCORD_WEBHOOK"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Manage price URLs
        if: ${{ inputs.add_urls != '' || inputs.remove_numbers != '' }}
        env:
          ADD_URLS: ${{ inputs.add_urls }}
          REMOVE_NUMBERS: ${{ inputs.remove_numbers }}
        run: python manage_price_urls.py

      - name: Check Naver Series
        if: ${{ inputs.add_urls == '' && inputs.remove_numbers == '' }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.SERIES_DISCORD_WEBHOOK }}
        run: python check.py

      - name: Check prices
        env:
          DISCORD_WEBHOOK: ${{ secrets.PRICE_DISCORD_WEBHOOK }}
          ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
          SEND_CURRENT_REPORT: "0"
        run: python price_watch_runner.py

      - name: Check Ridi comic calendar
        if: ${{ inputs.add_urls == '' && inputs.remove_numbers == '' }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.SERIES_DISCORD_WEBHOOK }}
        run: python ridi_calendar_watch.py

      - name: Check Aladin ebook comic calendar
        if: ${{ inputs.add_urls == '' && inputs.remove_numbers == '' }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.SERIES_DISCORD_WEBHOOK }}
        run: python aladin_calendar_watch.py

      - name: Send numbered current price list
        if: ${{ always() && inputs.send_current_prices }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.PRICE_DISCORD_WEBHOOK }}
        run: python numbered_price_report.py

      - name: Save state and URL list
        if: ${{ always() }}
        run: |
          if git diff --quiet -- state.json price_state.json price_urls.txt ridi_calendar_state.json aladin_calendar_state.json; then
            echo "상태/URL 파일 변경 없음"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json price_state.json price_urls.txt ridi_calendar_state.json aladin_calendar_state.json
          git commit -m "chore: update watch state and price URLs"

          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push 충돌, 재시도 ${attempt}/4"
            sleep $((attempt * 2))
          done

          echo "manual watch state push 실패" >&2
          exit 1
