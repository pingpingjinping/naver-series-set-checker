name: Monthly Release Parser Test

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/monthly-release-parser-test.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Inspect source markup
        run: |
          python - <<'PY'
          import requests
          import monthly_release_report as m

          text = m.jina_text(m.RIDI_URL)
          print('RIDI ICON MAP', m.ridi_icon_map(text))
          lines = text.splitlines()
          for needle in ['RIDI ONLY', '보이시한 여자친구가 너무 귀여워']:
              print('\n===', needle)
              hits = [i for i, line in enumerate(lines) if needle in line]
              print('hits', hits[:5])
              for i in hits[:2]:
                  for j in range(max(0, i-2), min(len(lines), i+8)):
                      print(f'{j}: {lines[j]}')

          url = m.ALADIN_LIST_URL
          for label, headers in [
              ('none', {}),
              ('mozilla', {'User-Agent':'Mozilla/5.0'}),
              ('browser', m.HEADERS),
          ]:
              try:
                  r=requests.get(url,headers=headers,timeout=30)
                  print('ALADIN', label, r.status_code, len(r.content), repr(r.text[:100]))
              except Exception as e:
                  print('ALADIN', label, 'ERR', repr(e))
          PY
