name: Monthly Release Parser Test

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/monthly-release-parser-test.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Inspect Ridi badges
        run: |
          python - <<'PY'
          import re
          from collections import Counter
          import monthly_release_report as m

          text = m.jina_text(m.RIDI_URL)
          lines = text.splitlines()
          print('--- FIRST 60 LINES ---')
          for i, line in enumerate(lines[:60]):
              print(f'{i}: {line}')

          bullet = re.compile(r'^\s*[-*]\s+(.+?)\s*$')
          current_title = None
          combos = Counter()
          examples = {}
          for line in lines:
              b = bullet.match(line.strip())
              if b:
                  current_title = m.clean_markdown(b.group(1))
                  continue
              imgs = m.MD_IMAGE_DETAIL_RE.findall(line)
              if current_title and imgs:
                  keys = tuple(m.image_key(url) for _, url in imgs)
                  if keys:
                      combos[keys] += 1
                      examples.setdefault(keys, current_title)
                      current_title = None

          print('\n--- BADGE COMBOS ---')
          for keys, count in combos.most_common():
              print(count, keys, 'EXAMPLE=', examples[keys])
          PY
