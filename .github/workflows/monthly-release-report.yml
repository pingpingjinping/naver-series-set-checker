name: Ridi & Aladin Monthly Release Report

on:
  workflow_dispatch:
    inputs:
      source:
        description: "보낼 캘린더"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - ridi
          - aladin

permissions:
  contents: read

concurrency:
  group: monthly-release-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send current month release report
        env:
          DISCORD_WEBHOOK: ${{ secrets.SERIES_DISCORD_WEBHOOK }}
          SOURCE: ${{ inputs.source }}
        run: python monthly_release_report_compact.py
