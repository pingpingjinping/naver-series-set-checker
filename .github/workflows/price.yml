name: WalnutPi Price Watch

on:
  workflow_dispatch:
  push:
    paths:
      - "price_state.json"

permissions:
  contents: write

concurrency:
  group: price-state-writes
  cancel-in-progress: false

jobs:
  price:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check prices
        env:
          DISCORD_WEBHOOK: ${{ secrets.PRICE_DISCORD_WEBHOOK }}
          SEND_CURRENT_REPORT: "0"
        run: python price_watch_runner.py

      - name: Save state
        run: |
          if git diff --quiet -- price_state.json; then
            echo "price_state.json 변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add price_state.json
          git commit -m "chore: update price state"

          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push 충돌, 재시도 ${attempt}/4"
            sleep $((attempt * 2))
          done

          echo "price state push 실패" >&2
          exit 1
