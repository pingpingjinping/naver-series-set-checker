name: WalnutPi Price Watch

on:
  workflow_dispatch:
    inputs:
      force_run:
        description: "현재 scheduler mode와 무관하게 수동/중앙 스케줄러 실행"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: price-state-writes
  cancel-in-progress: false

jobs:
  price:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide scheduler source
        id: scheduler
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_RUN: ${{ inputs.force_run || false }}
        run: python scheduler_decision.py

      - name: Set up Python
        if: ${{ steps.scheduler.outputs.run == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: ${{ steps.scheduler.outputs.run == 'true' }}
        run: pip install -r requirements.txt

      - name: Check prices
        if: ${{ steps.scheduler.outputs.run == 'true' }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.PRICE_DISCORD_WEBHOOK }}
          ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
          SEND_CURRENT_REPORT: "0"
        run: python price_watch_runner.py

      - name: Save state
        if: ${{ steps.scheduler.outputs.run == 'true' }}
        run: |
          if git diff --quiet -- price_state.json; then
            echo "price_state.json 변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add price_state.json
          git commit -m "chore: update price state"

          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push 충돌, 재시도 ${attempt}/4"
            sleep $((attempt * 2))
          done

          echo "price state push 실패" >&2
          exit 1
