name: Proxy Test

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/proxy-test.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compare fetch clients
        shell: bash
        run: |
          set +e
          URL='https://r.jina.ai/http://ridibooks.com/event/11339'
          echo '--- curl ---'
          curl -L -A 'Mozilla/5.0' -sS --max-time 30 -o /tmp/curl-body "$URL" -w 'status=%{http_code} bytes=%{size_download}\n'
          head -c 120 /tmp/curl-body; echo

          echo '--- requests default ---'
          python - <<'PY'
          import requests
          u='https://r.jina.ai/http://ridibooks.com/event/11339'
          for label, headers in [
              ('none', {}),
              ('mozilla', {'User-Agent':'Mozilla/5.0'}),
              ('browser', {'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36', 'Accept-Language':'ko-KR,ko;q=0.9,en;q=0.8'}),
          ]:
              try:
                  r=requests.get(u,headers=headers,timeout=30)
                  print(label, r.status_code, len(r.content), repr(r.text[:120]))
              except Exception as e:
                  print(label, 'ERR', repr(e))
          PY
