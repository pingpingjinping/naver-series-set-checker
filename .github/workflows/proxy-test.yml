name: Proxy Test

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/proxy-test.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify parsers
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import monthly_release_report as m

          now = datetime.now(ZoneInfo('Asia/Seoul'))
          for name, fn in [('ridi', m.parse_ridi), ('aladin', m.parse_aladin)]:
              groups, url = fn(now.year, now.month)
              total = sum(len(v['titles']) for v in groups.values())
              print(f'{name}: groups={len(groups)} total={total} url={url}')
              for day in sorted(groups)[:3]:
                  print(day, groups[day]['label'], groups[day]['titles'][:3])
          PY
