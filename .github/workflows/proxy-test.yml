name: Proxy Test

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/proxy-test.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Probe fallback URLs
        shell: bash
        run: |
          set +e
          urls=(
            'https://r.jina.ai/http://ridibooks.com/event/11339'
            'https://r.jina.ai/http://www.aladin.co.kr/events/wevent.aspx?EventId=314299'
            'https://r.jina.ai/http://mall.aladin.co.kr/events/wevent.aspx?EventId=314299'
            'https://mall.aladin.co.kr/events/wevent.aspx?EventId=314299'
          )
          i=0
          for url in "${urls[@]}"; do
            i=$((i+1))
            echo "===== $i $url"
            code=$(curl -L -A 'Mozilla/5.0' -sS --max-time 30 -o /tmp/body "$url" -w '%{http_code}')
            bytes=$(wc -c </tmp/body 2>/dev/null || echo 0)
            echo "status=$code bytes=$bytes"
            head -c 400 /tmp/body | tr '\n' ' '; echo
            echo "date samples:"
            grep -Eo '(^|[^0-9])[0-9]{1,2}\([^)]{1,4}\)|[0-9]{1,2}\.[0-9]{1,2}\.\([^)]{1,4}\)' /tmp/body | head -n 5 || true
          done
