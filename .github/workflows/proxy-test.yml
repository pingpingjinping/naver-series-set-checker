name: Proxy Test

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/proxy-test.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Inspect Aladin item HTML
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          url='https://mall.aladin.co.kr/events/wevent.aspx?EventId=314299'
          r=requests.get(url,headers={'User-Agent':'Mozilla/5.0'},timeout=30)
          print('status',r.status_code,len(r.content))
          soup=BeautifulSoup(r.text,'html.parser')
          node=soup.find(string=lambda s: s and '요리 군과 다시 만날 수는 없어' in s)
          print('node=',repr(node))
          if node:
              p=node.parent
              for level in range(5):
                  print('\nLEVEL',level,'tag=',p.name,'class=',p.get('class'),'id=',p.get('id'))
                  print(str(p)[:5000])
                  p=p.parent
          PY
