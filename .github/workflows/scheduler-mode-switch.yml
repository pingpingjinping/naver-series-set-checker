name: Scheduler Mode Switch

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 주체"
        required: true
        default: "pi"
        type: choice
        options:
          - pi
          - github

permissions:
  contents: write

concurrency:
  group: scheduler-mode-switch
  cancel-in-progress: false

jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set scheduler mode
        env:
          TARGET_MODE: ${{ inputs.mode }}
        run: |
          printf '%s\n' "$TARGET_MODE" > scheduler_mode.txt

          if git diff --quiet -- scheduler_mode.txt; then
            echo "이미 scheduler mode가 $TARGET_MODE 입니다."
            echo "### Scheduler mode: $TARGET_MODE" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scheduler_mode.txt
          git commit -m "chore: switch scheduler mode to $TARGET_MODE"

          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "### Scheduler mode: $TARGET_MODE" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "push 충돌, 재시도 ${attempt}/4"
            sleep $((attempt * 2))
          done

          echo "scheduler mode push 실패" >&2
          exit 1
