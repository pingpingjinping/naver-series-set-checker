name: WalnutPi Naver Series Watch

on:
  workflow_dispatch:
    inputs:
      test_ping:
        description: "WalnutPi cron trigger test notification"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: watch-state-writes
  cancel-in-progress: false

jobs:
  series:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send WalnutPi trigger test
        if: ${{ inputs.test_ping }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.SERIES_DISCORD_WEBHOOK }}
        run: |
          curl -fsS \
            -H 'Content-Type: application/json' \
            -d '{"content":"✅ WalnutPi → GitHub Actions 시리즈 트리거 성공!"}' \
            "$DISCORD_WEBHOOK"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Naver Series
        env:
          DISCORD_WEBHOOK: ${{ secrets.SERIES_DISCORD_WEBHOOK }}
        run: python check.py

      - name: Save state
        run: |
          if git diff --quiet -- state.json; then
            echo "state.json 변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "chore: update Naver Series state"
          git push
