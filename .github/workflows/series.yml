name: WalnutPi Naver Series Watch

on:
  workflow_dispatch:
    inputs:
      test_ping:
        description: "WalnutPi cron trigger test notification"
        required: false
        default: false
        type: boolean
      force_run:
        description: "현재 scheduler mode와 무관하게 수동 실행"
        required: false
        default: false
        type: boolean
  schedule:
    # GitHub mode primary: 06:10 KST = 21:10 UTC (previous calendar day)
    - cron: "10 21 * * *"
    # Pi mode failover check: 06:30 KST = 21:30 UTC (previous calendar day)
    - cron: "30 21 * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: series-state-writes
  cancel-in-progress: false

jobs:
  series:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide scheduler source
        id: scheduler
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
          FORCE_RUN: ${{ inputs.force_run || false }}
          WORKFLOW_FILE: series.yml
          GH_TOKEN: ${{ github.token }}
        run: python scheduler_decision.py

      - name: Send WalnutPi trigger test
        if: ${{ steps.scheduler.outputs.run == 'true' && inputs.test_ping }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.SERIES_DISCORD_WEBHOOK }}
        run: |
          curl -fsS \
            -H 'Content-Type: application/json' \
            -d '{"content":"✅ WalnutPi → GitHub Actions 시리즈 트리거 성공!"}' \
            "$DISCORD_WEBHOOK"

      - name: Set up Python
        if: ${{ steps.scheduler.outputs.run == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: ${{ steps.scheduler.outputs.run == 'true' }}
        run: pip install -r requirements.txt

      - name: Check Naver Series
        if: ${{ steps.scheduler.outputs.run == 'true' }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.SERIES_DISCORD_WEBHOOK }}
        run: python check.py

      - name: Save state
        if: ${{ steps.scheduler.outputs.run == 'true' }}
        run: |
          if git diff --quiet -- state.json; then
            echo "state.json 변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "chore: update Naver Series state"

          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push 충돌, 재시도 ${attempt}/4"
            sleep $((attempt * 2))
          done

          echo "state push 실패" >&2
          exit 1
