name: Cookie Sale Regression Tests

on:
  pull_request:
    paths:
      - "pi/cookie_sale_checker.py"
      - "tests/test_cookie_sale_checker.py"
      - ".github/workflows/test-cookie-sale.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run cookie-sale regression tests
        run: python -m unittest discover -s tests -p 'test_cookie_sale_checker.py' -v
